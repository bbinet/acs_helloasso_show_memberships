<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adhésions ACS - administration</title>
  </head>
  <body class="paper container-lg">
    <div id="service">Registre des envois : chargement...</div>
    <div id="dates"></div>
    <h2>Adhésions ACS - saison <span id="season"></span></h2>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="members" aria-selected="true">Adhérents</button>
      <button role="tab" data-tab="list" aria-selected="false">Factures et exports</button>
      <button role="tab" data-tab="stats" aria-selected="false">Statistiques</button>
      <button role="tab" data-tab="activities" aria-selected="false">Statistiques par activité</button>
    </nav>

    <!-- Même liste que la page des adhérents -->
    <section id="tab-members">
      <div class="row">
        <div id="m-filter" class="sm-12 md-6 lg-6 col"></div>
        <div id="m-search" class="sm-12 md-6 lg-6 col"></div>
      </div>
      <h3>Nombre total de résultats : <span id="m-count"></span></h3>
      <div id="m-datas"><p>...</p></div>
      <div class="row">
        <span id="m-paginationOptions" class="sm-5 md-4 lg-3 col"></span>
        <span id="m-pages" class="col-fill col"></span>
      </div>
    </section>

    <section id="tab-list" hidden>
      <div class="row flex-middle filters">
        <div class="sm-12 md-6 col">
          <input id="search" type="search" class="search" placeholder="Rechercher (nom, entreprise, email, n°)..." />
        </div>
        <div class="sm-6 md-3 col">
          <select id="activity"><option value="">Toutes les activités</option></select>
        </div>
        <div class="sm-6 md-3 col">
          <select id="filter">
            <option value="">Toutes les factures</option>
            <option value="todo">À envoyer</option>
            <option value="sent">Envoyées</option>
            <option value="problem">En erreur</option>
          </select>
        </div>
        <div class="sm-12 md-4 col">
          <select id="formula"><option value="">Tous les tarifs</option></select>
        </div>
        <div class="sm-6 md-3 col">
          <label for="from">Inscrits du</label>
          <input id="from" type="date" />
        </div>
        <div class="sm-6 md-3 col">
          <label for="to">au</label>
          <input id="to" type="date" />
        </div>
        <div class="sm-12 md-2 col">
          <select id="pageSize">
            <option value="50">50 par page</option>
            <option value="100" selected>100 par page</option>
            <option value="200">200 par page</option>
            <option value="0">Toutes</option>
          </select>
        </div>
      </div>
      <div class="row flex-middle">
        <div class="col">
          <button id="sendSelected" class="btn-secondary" disabled>Envoyer la sélection</button>
          <button id="sendAll" class="btn-primary" disabled>Envoyer les factures à envoyer</button>
          <button id="selectAll">Tout sélectionner</button>
          <button id="selectNone" disabled>Tout désélectionner</button>
        </div>
        <div class="col">
          <button id="exportCsv">Exporter en CSV</button>
          <button id="copyEmails">Copier les emails</button>
        </div>
      </div>
      <p id="progress"></p>

      <h3>Nombre d'adhérents : <span id="count"></span></h3>
      <div id="invoices"><p>...</p></div>
      <div id="pages" class="row flex-center"></div>
    </section>

    <section id="tab-stats" hidden>
      <div id="stats"><p>Chargement des statistiques...</p></div>
    </section>

    <section id="tab-activities" hidden>
      <div id="activity-stats"><p>Chargement des statistiques...</p></div>
    </section>

    <script type="module" src="/src/admin-main.ts"></script>
  </body>
</html>
