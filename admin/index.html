<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factures ACS</title>
  </head>
  <body class="paper container-lg">
    <div id="dates"></div>
    <h2>Factures ACS - saison <span id="season"></span></h2>
    <p><a href="../">Liste des adhérents</a></p>

    <div id="service" class="alert alert-secondary">Chargement des statuts d'envoi...</div>

    <div class="row flex-middle">
      <div class="sm-12 md-4 col">
        <input id="search" type="search" placeholder="Rechercher (nom, entreprise, email, n°)..." />
      </div>
      <div class="sm-12 md-3 col">
        <select id="filter">
          <option value="">Toutes les factures</option>
          <option value="todo">À envoyer</option>
          <option value="envoyée">Envoyées</option>
          <option value="problem">En erreur</option>
        </select>
      </div>
      <div class="sm-12 md-5 col">
        <button id="sendAll" class="btn-primary" disabled>Envoyer les factures à envoyer</button>
      </div>
    </div>
    <p id="progress"></p>

    <h3>Nombre de factures : <span id="count"></span></h3>
    <div id="invoices"><p>...</p></div>

    <script type="module" src="/src/admin-main.ts"></script>
  </body>
</html>
