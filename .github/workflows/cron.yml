name: Mise à jour de la saison en cours

on:
  schedule:
    - cron: "0 10 * * *"  # 10h00 UTC : 11h00 à Paris en heure d'hiver, 12h00 en heure d'été
  workflow_dispatch:
  # À chaque mise à jour de master : le script ne publie que si le code des pages a changé
  push:
    branches: [master]

permissions:
  contents: write

# Ne jamais lancer deux publications en même temps sur gh-pages
concurrency:
  group: gh-pages

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          config-json: ${{ secrets.CONFIG_JSON }}
          signature: ${{ secrets.INVOICE_SIGNATURE }}
      # Résumés des saisons archivées (sans données personnelles), récupérés une seule fois sur HelloAsso :
      # le cache de la dernière exécution est restauré, puis enregistré à nouveau avec les saisons ajoutées
      - uses: actions/cache@v4
        with:
          path: acs-history
          key: acs-history-${{ github.run_id }}
          restore-keys: acs-history-
      - run: ./cron.sh
