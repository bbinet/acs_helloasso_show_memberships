name: Régénération des saisons archivées

# Récupère à nouveau sur HelloAsso les saisons archivées et republie archives.enc (voir archives.sh).
# Rarement utile : cron.yml le fait déjà quand une saison archivée manque ou que le mot de passe admin a changé.
on:
  workflow_dispatch:

permissions:
  contents: write

# Ne jamais lancer deux publications en même temps sur gh-pages
concurrency:
  group: gh-pages

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          config-json: ${{ secrets.CONFIG_JSON }}
      - run: ./archives.sh
